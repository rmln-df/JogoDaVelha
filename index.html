<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TIC TAC TOE PRO</title>

<style>

:root{
--cor-x:#ff4d4d;
--cor-o:#2ecc71;
--glass:rgba(255,255,255,.06);
--bg:rgba(255,255,255,.05);
--borda:rgba(255,255,255,.1)
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

body{
font-family:'Segoe UI',Tahoma,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:100vh;
overflow:hidden;
padding:15px;
color:#ff8;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#111);
background-size:400% 400%;
animation:bg 12s ease infinite
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* SPLASH */

#splash-screen{
position:fixed;
inset:0;
background:#0f172a;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999
}

.splash-titulo{
font-size:3rem;
font-weight:900;
background:linear-gradient(45deg,var(--cor-x),var(--cor-o));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.splash-subtitulo{
margin:10px 0 40px;
letter-spacing:6px;
color:#94a3b8
}

.btn-jogar-splash,.btn-reiniciar,.btn-som,.modal-content button,.menu-btn{
border:none;
cursor:pointer;
color:#fff;
font-weight:bold
}

.btn-jogar-splash{
padding:16px 55px;
border-radius:60px;
font-size:4.3rem;
font-weight:800;
letter-spacing:2px;
color:#ff8;
cursor:pointer;
position:relative;
overflow:hidden;
background:linear-gradient(45deg,#2563eb,#3b82f6,#60a5fa);
background-size:300% 300%;
animation:gradienteBtn 5s ease infinite,flutuar 2s ease-in-out infinite;
}

.btn-jogar-splash::before{
content:'';
position:absolute;
top:-50%;
left:-30%;
width:40%;
height:200%;
background:rgba(255,255,255,.25);
transform:rotate(25deg);
animation:brilho 2.5s linear infinite;
}

@keyframes gradienteBtn{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

@keyframes brilho{
0%{left:-40%}
100%{left:140%}
}

@keyframes flutuar{
0%{transform:translateY(0px)}
50%{transform:translateY(-4px)}
100%{transform:translateY(0px)}
}

/* APP */

#conteudo-jogo{
display:none;
flex-direction:column;
align-items:center;
width:100%;
max-width:500px
}

/* PLACAR */

.placar{
width:100%;
display:flex;
justify-content:space-around;
gap:15px;
padding:12px;
margin-bottom:15px;
border-radius:16px;
background:rgba(255,255,255,.08)
}

.placar span{
display:flex;
flex-direction:column;
align-items:center;
gap:6px
}

.placar b{
font-size:3.4rem
}

/* CONTROLES */

.controles{
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:15px
}

.coluna-seletores,.area-botoes{
display:flex;
flex-direction:column;
gap:8px
}

.menu-box{
position:relative
}

.menu-btn,.btn-som{
width:100%;
height:50px;
border-radius:8px;
background:#ff4400;
font-size:1.2rem;
transition:.2s;
color:#fff;
font-weight:bold;
border:none
}

.menu-btn.ativo{
background:#2563eb
}

.menu-select{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer
}

.btn-reiniciar{
width:100%;
height:108px;
border-radius:10px;
background:#ff5500;
font-size:2.4rem;
border:none;
color:#fff;
font-weight:bold
}

.btn-som{
background:#0f766e
}

.status{
margin-bottom:15px;
min-height:28px;
font-size:1.2rem;
font-weight:700
}

/* TABULEIRO */

.tabuleiro{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
width:100%;
max-width:520px;
aspect-ratio:1/1
}

.celula{
border:1px solid var(--borda);
border-radius:16px;
background:var(--bg);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
min-height:95px;
transition:.2s
}

.celula.X{
color:var(--cor-x);
font-size:3.2rem;
font-weight:900;
line-height:1;
}

.celula.O::after{
content:'';
width:50%;
height:50%;
border-radius:50%;
border:5px solid var(--cor-o)
}

.vencedora{
background:linear-gradient(45deg,#f59e0b,#d97706)!important
}

.esmaecer{
animation:piscar .8s infinite alternate ease-in-out
}

@keyframes piscar{
from{
opacity:.7;
transform:scale(.96)
}

to{
opacity:.2;
transform:scale(.9)
}
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(15,23,42,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.3s
}

.modal.mostrar{
opacity:1;
visibility:visible
}

.modal-content{
width:100%;
max-width:320px;
background:#1e293b;
padding:30px 24px;
border-radius:20px;
text-align:center
}

.modal-content button{
width:100%;
padding:12px;
border-radius:12px;
background:linear-gradient(45deg,#10b981,#059669);
border:none;
color:#fff;
font-weight:bold
}

</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash-screen">

<div class="splash-titulo">
JOGO DA VELHA
</div>

<div class="splash-subtitulo">
ULTIMATE PRO
</div>

<button class="btn-jogar-splash"
onclick="inicializarEEntrarNoJogo()">
START
</button>

</div>

<!-- APP -->

<div id="conteudo-jogo">

<div class="placar">

<span>
🏆 Você
<b id="pUser">0</b>
</span>

<span>
🤖 IA/J2
<b id="pIA">0</b>
</span>

<span>
🤝 Empates
<b id="pEmpate">0</b>
</span>

</div>

<div class="controles">

<div class="coluna-seletores">

<!-- JOGADOR -->

<div class="menu-box">

<button class="menu-btn ativo" id="btnJogador">
Jogador: ❌
</button>

<select
id="simboloUsuario"
class="menu-select"
onchange="alterarJogador();reiniciarJogo()">

<option value="X" selected>
❌
</option>

<option value="O">
🟢
</option>

</select>

</div>

<!-- MODO -->

<div class="menu-box">

<button class="menu-btn ativo" id="btnModo">
Modo: Clássico
</button>

<select
id="modo"
class="menu-select"
onchange="alterarModo();reiniciarJogo()">

<option value="classico" selected>
Clássico
</option>

<option value="infinito">
Infinito
</option>

<option value="dupla">
2 Jogadores
</option>

</select>

</div>

<!-- NÍVEL -->

<div class="menu-box">

<button class="menu-btn ativo" id="btnNivel">
Nível: Difícil
</button>

<select
id="dificuldade"
class="menu-select"
onchange="alterarNivel()">

<option value="facil">
Fácil
</option>

<option value="medio">
Médio
</option>

<option value="dificil" selected>
Difícil
</option>

</select>

</div>

</div>

<div class="area-botoes">

<button class="btn-reiniciar"
onclick="reiniciarJogo()">

Reiniciar<br>
partida

</button>

<button
class="btn-som"
id="btnSom"
onclick="alternarSom()">

🔊 Som Ligado

</button>

</div>

</div>

<div class="status" id="status"></div>

<div class="tabuleiro">

<button class="celula" data-index="0" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="1" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="2" onclick="jogadaUsuario(event)"></button>

<button class="celula" data-index="3" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="4" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="5" onclick="jogadaUsuario(event)"></button>

<button class="celula" data-index="6" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="7" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="8" onclick="jogadaUsuario(event)"></button>

</div>

</div>

<!-- MODAL -->

<div class="modal" id="modalFinal">

<div class="modal-content">

<h2 id="textoFinal"></h2>

<button onclick="fecharModalEResetar()">
Jogar Novamente
</button>

</div>

</div>

<script>

/* SOM */

let somAtivado=true;

const audioCtx =
new (
window.AudioContext ||
window.webkitAudioContext
)();

function tocarSom(freq=440,d=120){

if(!somAtivado)return;

try{

const osc=audioCtx.createOscillator();

const gain=audioCtx.createGain();

osc.frequency.value=freq;

osc.connect(gain);

gain.connect(audioCtx.destination);

gain.gain.value=.08;

osc.start();

setTimeout(()=>{
osc.stop();
},d);

}catch(e){}
}

function alternarSom(){

somAtivado=!somAtivado;

document.getElementById('btnSom').innerHTML=
somAtivado
?'🔊 Som Ligado'
:'🔇 Som Desligado';
}

function alterarJogador(){

const valor=
document.getElementById('simboloUsuario').value;

document.getElementById('btnJogador').innerHTML=
valor==='X'
?'Jogador: ❌'
:'Jogador: 🟢';
}

function alterarModo(){

const valor=
document.getElementById('modo').value;

let texto='';

if(valor==='classico')texto='Modo: Clássico';
if(valor==='infinito')texto='Modo: Infinito';
if(valor==='dupla')texto='Modo: 2 Jogadores';

document.getElementById('btnModo').innerHTML=
texto;
}

function alterarNivel(){

const valor=
document.getElementById('dificuldade').value;

let texto='';

if(valor==='facil')texto='Fácil';
if(valor==='medio')texto='Médio';
if(valor==='dificil')texto='Difícil';

document.getElementById('btnNivel').innerHTML=
'Nível: '+texto;
}

function inicializarEEntrarNoJogo(){

tocarSom(500);

document.getElementById('splash-screen').style.display='none';

document.getElementById('conteudo-jogo').style.display='flex';

atualizarTextoStatus();
}

/* ESTADO */

let tabuleiro=['','','','','','','','',''];

let jogoAtivo=true;

let turnoAtual='X';

let historicoX=[];

let historicoO=[];

const VITORIAS=[

[0,1,2],
[3,4,5],
[6,7,8],

[0,3,6],
[1,4,7],
[2,5,8],

[0,4,8],
[2,4,6]

];

/* STATUS */

function atualizarTextoStatus(){

const status=
document.getElementById('status');

const usuario=
document.getElementById('simboloUsuario').value;

const modo=
document.getElementById('modo').value;

if(modo==='dupla'){

status.innerHTML=
turnoAtual==='X'
?'❌ Vez do Jogador 1'
:'🟢 Vez do Jogador 2';

return;
}

status.innerHTML=
turnoAtual===usuario
?'🙋🏻 Sua vez'
:'🤖 Máquina pensando...';
}

/* MODO INFINITO */

function registrarJogada(jogador,i){

const modo=
document.getElementById('modo').value;

const h=
jogador==='X'
?historicoX
:historicoO;

h.push(i);

if(
modo==='infinito'
&&
h.length>3
){

const removida=h.shift();

tabuleiro[removida]='';
}
}

/* JOGADOR */

function jogadaUsuario(e){

if(!jogoAtivo)return;

const modo=
document.getElementById('modo').value;

const usuario=
document.getElementById('simboloUsuario').value;

if(
modo!=='dupla'
&&
turnoAtual!==usuario
)return;

const i=parseInt(e.target.dataset.index);

if(tabuleiro[i]!=='')return;

tocarSom(500);

tabuleiro[i]=turnoAtual;

registrarJogada(turnoAtual,i);

atualizarTabuleiro();

if(verificarFim(turnoAtual))return;

if(modo==='dupla'){

turnoAtual=
turnoAtual==='X'
?'O'
:'X';

}else{

turnoAtual=
usuario==='X'
?'O'
:'X';

setTimeout(jogadaIA,150);
}

atualizarTextoStatus();
}

/* IA */

function jogadaIA(){

if(
document.getElementById('modo').value
==='dupla'
)return;

if(!jogoAtivo)return;

const usuario=
document.getElementById('simboloUsuario').value;

const maquina=
usuario==='X'
?'O'
:'X';

if(turnoAtual!==maquina)return;

const dificuldade=
document.getElementById('dificuldade').value;

let escolha=null;

/* FÁCIL */

if(dificuldade==='facil'){

escolha=aleatoria();

}

/* MÉDIO */

else if(dificuldade==='medio'){

escolha=
Math.random()<.5
?melhorJogada(maquina,usuario)
:aleatoria();

}

/* DIFÍCIL */

else{

escolha=
melhorJogada(maquina,usuario);

}

if(escolha===null)return;

tocarSom(250);

tabuleiro[escolha]=maquina;

registrarJogada(maquina,escolha);

atualizarTabuleiro();

if(verificarFim(maquina))return;

turnoAtual=usuario;

atualizarTextoStatus();
}

/* IA ALEATÓRIA */

function aleatoria(){

const livres=[];

tabuleiro.forEach((c,i)=>{

if(c===''){

livres.push(i);

}
});

if(!livres.length)return null;

return livres[
Math.floor(Math.random()*livres.length)
];
}

/* IA INTELIGENTE */

function melhorJogada(maquina,usuario){

for(let i=0;i<9;i++){

if(tabuleiro[i]===''){

tabuleiro[i]=maquina;

if(vitoria(maquina)){

tabuleiro[i]='';

return i;
}

tabuleiro[i]='';
}
}

for(let i=0;i<9;i++){

if(tabuleiro[i]===''){

tabuleiro[i]=usuario;

if(vitoria(usuario)){

tabuleiro[i]='';

return i;
}

tabuleiro[i]='';
}
}

if(tabuleiro[4]===''){

return 4;

}

return aleatoria();
}

/* TABULEIRO */

function atualizarTabuleiro(){

const c=
document.querySelectorAll('.celula');

c.forEach((el,i)=>{

el.innerHTML='';

el.className='celula';

if(tabuleiro[i]==='X'){

el.innerHTML='❌';

el.classList.add('X');

}else if(tabuleiro[i]==='O'){

el.classList.add('O');
}
});

if(
document.getElementById('modo').value
==='infinito'
){

if(historicoX.length>=3)
c[historicoX[0]]
.classList.add('esmaecer');

if(historicoO.length>=3)
c[historicoO[0]]
.classList.add('esmaecer');
}
}

/* VITÓRIA */

function vitoria(j){

return VITORIAS.some(v=>

tabuleiro[v[0]]===j &&
tabuleiro[v[1]]===j &&
tabuleiro[v[2]]===j

);
}

/* FINAL */

function verificarFim(j){

if(vitoria(j)){

jogoAtivo=false;

const modo=
document.getElementById('modo').value;

const usuario=
document.getElementById('simboloUsuario').value;

if(modo==='dupla'){

if(j==='X'){

document.getElementById('pUser').innerText++;

}else{

document.getElementById('pIA').innerText++;
}

}else{

if(j===usuario){

document.getElementById('pUser').innerText++;

}else{

document.getElementById('pIA').innerText++;
}
}

if(modo==='dupla'){

document.getElementById('textoFinal').innerHTML=
j==='X'
?'🏆 Jogador 1 venceu!'
:'🏆 Jogador 2 venceu!';

}else{

document.getElementById('textoFinal').innerHTML=
j===usuario
?'🏆 Você venceu!'
:'🤖 A IA venceu!';
}

abrirModal();

return true;
}

if(tabuleiro.every(c=>c!=='')){

jogoAtivo=false;

document.getElementById('pEmpate').innerText++;

document.getElementById('textoFinal').innerHTML=
'🤝 Empate!';

abrirModal();

return true;
}

return false;
}

/* MODAL */

function abrirModal(){

document.getElementById('modalFinal')
.classList.add('mostrar');
}

function fecharModalEResetar(){

document.getElementById('modalFinal')
.classList.remove('mostrar');

setTimeout(reiniciarJogo,200);
}

/* RESET */

function reiniciarJogo(){

tabuleiro=['','','','','','','','',''];

historicoX=[];

historicoO=[];

jogoAtivo=true;

turnoAtual='X';

atualizarTabuleiro();

atualizarTextoStatus();

if(
document.getElementById('simboloUsuario').value
==='O'
&&
document.getElementById('modo').value
!=='dupla'
){

setTimeout(jogadaIA,150);
}
}

</script>

</body>
</html>
