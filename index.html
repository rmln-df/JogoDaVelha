<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

<title>TIC TAC TOE PRO</title>

<style>

:root{
    --cor-x:#ff4d4d;
    --cor-o:#2ecc71;
    --cor-bg-celula:rgba(255,255,255,.05);
    --cor-borda-celula:rgba(255,255,255,.1);
    --glass:rgba(255,255,255,.06);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    color:#ff6600;
    touch-action:manipulation;
    padding:15px;

    background:
    linear-gradient(
        -45deg,
        #0f2027,
        #203a43,
        #2c5364,
        #111
    );

    background-size:400% 400%;

    animation:fundoAnimado 12s ease infinite;
}

@keyframes fundoAnimado{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* SPLASH */

#splash-screen{
    position:fixed;
    inset:0;
    background:#0f172a;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:9999;
    padding:20px;
}

.splash-titulo{
    font-size:3rem;
    font-weight:900;

    background:
    linear-gradient(
        45deg,
        var(--cor-x),
        var(--cor-o)
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:5px;

    text-align:center;
}

.splash-subtitulo{
color:#94a3b8
    letter-spacing:6px;
    margin-bottom:40px;
}

.btn-jogar-splash{
    padding:14px 40px;
    font-size:1.2rem;
    font-weight:bold;
    color:white;

    background:
    linear-gradient(
        45deg,
        #3b82f6,
        #1d4ed8
    );

    border:none;
    border-radius:50px;

    cursor:pointer;

    animation:pulsar 1.5s infinite;
}

@keyframes pulsar{
    0%{transform:scale(1);}
    50%{transform:scale(1.06);}
    100%{transform:scale(1);}
}

/* CONTEÚDO */

#conteudo-jogo{
    display:none;
    flex-direction:column;
    align-items:center;

    width:100%;
    max-width:500px;
}

h1{
    font-size:2.5rem;
    margin-bottom:15px;
    font-weight:800;
    text-align:center;
}

/* PLACAR */

.placar{
    display:flex;
    gap:15px;

    margin-bottom:15px;

    background:var(--glass);

    backdrop-filter:blur(10px);

    padding:12px 20px;

    border-radius:16px;

    width:100%;

    justify-content:space-around;
}

.placar span{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-weight:600;
}

.placar b{
    font-size:1.4rem;
}

/* CONTROLES */

.controles{
    width:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:15px;
}

.coluna-seletores{
    display:flex;
    flex-direction:column;
    gap:8px;
}

select{
    width:100%;
    height:50px;

    border:none;
    outline:none;

    border-radius:8px;

    padding:0 12px;

    background:#b3b3b3;

    color:#ff1100;

    font-weight:bold;

    font-size:1.2rem;

    cursor:pointer;

    appearance:none;
}

select option{
    background:#1e293b"";
}

/* BOTÕES */

.area-botoes{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.btn-reiniciar{
    width:100%;
    height:108px;

    border:none;

    border-radius:10px;

    color:white;

    font-weight:bold;

    font-size:1.5rem;

    cursor:pointer;

    background:#2563eb;

    transition:.2s;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.btn-reiniciar:active{
    transform:scale(.98);
}

.btn-som{
    width:100%;
    height:50px;

    border:none;

    border-radius:10px;

    background:#0f766e;

    color:white;

    font-weight:bold;

    font-size:1rem;

    cursor:pointer;
}

/* STATUS */

.status{
    margin-bottom:15px;

    font-size:1.2rem;

    font-weight:700;

    min-height:28px;

    text-align:center;
}

/* TABULEIRO FIXO */

.tabuleiro{
    display:grid;

    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);

    gap:12px;

    width:100%;
    max-width:320px;

    aspect-ratio:1/1;

    min-height:320px;

    flex-shrink:0;
}

.celula{
    border:1px solid var(--cor-borda-celula);

    border-radius:16px;

    background:var(--cor-bg-celula);

    cursor:pointer;

    width:100%;
    height:100%;

    min-height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.celula:active{
    transform:scale(.95);
}

.celula.X{
    color:var(--cor-x);
    font-size:2.6rem;
    font-weight:800;
}

.celula.O::after{
    content:'';

    width:55%;
    height:55%;

    border-radius:50%;

    border:6px solid var(--cor-o);
}

.vencedora{
    background:
    linear-gradient(
        45deg,
        #f59e0b,
        #d97706
    ) !important;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;

    background:rgba(15,23,42,.85);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999;

    opacity:0;
    visibility:hidden;

    transition:.3s;

    padding:20px;
}

.modal.mostrar{
    opacity:1;
    visibility:visible;
}

.modal-content{
    background:#1e293b;

    padding:30px 24px;

    border-radius:20px;

    text-align:center;

    width:100%;
    max-width:320px;
}

.modal-content h2{
    margin-bottom:20px;
    font-size:1.6rem;
}

.modal-content button{
    border:none;

    padding:12px 24px;

    border-radius:12px;

    background:
    linear-gradient(
        45deg,
        #10b981,
        #059669
    );

    color:white;

    font-weight:bold;

    font-size:1rem;

    cursor:pointer;

    width:100%;
}

</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash-screen">

    <div class="splash-titulo">
        JOGO DA VELHA
    </div>

    <div class="splash-subtitulo">
        ULTIMATE PRO
    </div>

    <button
        class="btn-jogar-splash"
        onclick="inicializarEEntrarNoJogo()">

        START

    </button>

</div>

<!-- CONTEÚDO -->

<div id="conteudo-jogo">

    <h1>
        Jogo da Velha
    </h1>

    <!-- PLACAR -->

    <div class="placar">

        <span>
            🏆 Você
            <b id="pUser">0</b>
        </span>

        <span>
            🤖 IA
            <b id="pIA">0</b>
        </span>

        <span>
            🤝 Empates
            <b id="pEmpate">0</b>
        </span>

    </div>

    <!-- CONTROLES -->

    <div class="controles">

        <!-- SELECTS -->

        <div class="coluna-seletores">

            <select
                id="simboloUsuario"
                onchange="reiniciarJogo()">

                <option
                    value=""
                    disabled
                    selected>

                    Escolher o jogador

                </option>

                <option value="X">
                    ❌ Vermelho
                </option>

                <option value="O">
                    🟢Verde
                </option>

            </select>

            <select
                id="modo"
                onchange="reiniciarJogo()">

                <option
                    value=""
                    disabled
                    selected>

                    Tipo de jogo

                </option>

                <option value="classico">
                    Clássico
                </option>

                <option value="infinito">
                    Infinito
                </option>

            </select>

            <select id="dificuldade">

                <option
                    value=""
                    disabled
                    selected>

                    Nível

                </option>

                <option value="dificil">
                    Difícil
                </option>

                <option value="facil">
                    Fácil
                </option>

            </select>

        </div>

        <!-- BOTÕES -->

        <div class="area-botoes">

            <button
                class="btn-reiniciar"
                onclick="reiniciarJogo()">

                Reiniciar<br>
                partida

            </button>

            <button
                class="btn-som"
                id="btnSom"
                onclick="alternarSom()">

                🔊 Som Ligado

            </button>

        </div>

    </div>

    <!-- STATUS -->

    <div
        class="status"
        id="status">

    </div>

    <!-- TABULEIRO -->

    <div class="tabuleiro">

        <button class="celula" data-index="0" onclick="jogadaUsuario(event)"></button>
        <button class="celula" data-index="1" onclick="jogadaUsuario(event)"></button>
        <button class="celula" data-index="2" onclick="jogadaUsuario(event)"></button>

        <button class="celula" data-index="3" onclick="jogadaUsuario(event)"></button>
        <button class="celula" data-index="4" onclick="jogadaUsuario(event)"></button>
        <button class="celula" data-index="5" onclick="jogadaUsuario(event)"></button>

        <button class="celula" data-index="6" onclick="jogadaUsuario(event)"></button>
        <button class="celula" data-index="7" onclick="jogadaUsuario(event)"></button>
        <button class="celula" data-index="8" onclick="jogadaUsuario(event)"></button>

    </div>

</div>

<!-- MODAL -->

<div
    class="modal"
    id="modalFinal">

    <div class="modal-content">

        <h2 id="textoFinal"></h2>

        <button onclick="fecharModalEResetar()">

            Jogar Novamente

        </button>

    </div>

</div>

<script>

/* ESTADO */

let somAtivado = true;

let pontosUsuario = 0;
let pontosIA = 0;
let pontosEmpate = 0;

let tabuleiro = [
    '', '', '',
    '', '', '',
    '', '', ''
];

let jogoAtivo = true;

let turnoAtual = 'X';

const COMBINACOES_VITORIA = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]
];

/* SOM */

function tocarSom(
    freq = 440,
    duracao = 120
){

    if(!somAtivado) return;

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = 'sine';

        osc.frequency.value = freq;

        osc.connect(gain);

        gain.connect(ctx.destination);

        gain.gain.value = 0.08;

        osc.start();

        setTimeout(()=>{

            osc.stop();

            ctx.close();

        },duracao);

    }catch(e){}
}

function alternarSom(){

    somAtivado = !somAtivado;

    const btn =
        document.getElementById('btnSom');

    if(somAtivado){

        btn.innerHTML =
            '🔊 Som Ligado';

        btn.style.background =
            '#0f766e';

        tocarSom(500,100);

    }else{

        btn.innerHTML =
            '🔇 Som Desligado';

        btn.style.background =
            '#7f1d1d';
    }
}

/* START */

function inicializarEEntrarNoJogo(){

    tocarSom(500,120);

    document
        .getElementById('splash-screen')
        .style.display='none';

    document
        .getElementById('conteudo-jogo')
        .style.display='flex';

    atualizarTextoStatus();
}

/* CONFIG */

function obterUsuarioSimbolo(){

    return document
        .getElementById('simboloUsuario')
        .value || 'X';
}

/* STATUS */

function atualizarTextoStatus(){

    const status =
        document.getElementById('status');

    const usuario =
        obterUsuarioSimbolo();

    if(turnoAtual === usuario){

        status.innerHTML =
            'Sua vez';

    }else{

        status.innerHTML =
            '🤖 Máquina pensando...';
    }
}

/* JOGADA USUÁRIO */

function jogadaUsuario(e){

    if(!jogoAtivo) return;

    const usuario =
        obterUsuarioSimbolo();

    if(turnoAtual !== usuario) return;

    const cell = e.target;

    const index =
        parseInt(cell.dataset.index);

    if(tabuleiro[index] !== '') return;

    tocarSom(500,120);

    tabuleiro[index] = usuario;

    atualizarTabuleiroVisual();

    if(verificarFimDeJogo(usuario))
        return;

    turnoAtual =
        usuario === 'X'
        ? 'O'
        : 'X';

    atualizarTextoStatus();

    setTimeout(
        jogadaMaquina,
        500
    );
}

/* IA */

function jogadaMaquina(){

    if(!jogoAtivo) return;

    const usuario =
        obterUsuarioSimbolo();

    const maquina =
        usuario === 'X'
        ? 'O'
        : 'X';

    const vazias = [];

    tabuleiro.forEach((c,i)=>{

        if(c==='')
            vazias.push(i);
    });

    if(vazias.length===0)
        return;

    const escolha =
        vazias[
            Math.floor(
                Math.random()
                * vazias.length
            )
        ];

    tocarSom(250,120);

    tabuleiro[escolha] = maquina;

    atualizarTabuleiroVisual();

    if(verificarFimDeJogo(maquina))
        return;

    turnoAtual = usuario;

    atualizarTextoStatus();
}

/* TABULEIRO */

function atualizarTabuleiroVisual(){

    const celulas =
        document.querySelectorAll('.celula');

    celulas.forEach((celula,index)=>{

        celula.textContent='';

        celula.className='celula';

        if(tabuleiro[index]==='X'){

            celula.textContent='❌';

            celula.classList.add('X');

        }else if(
            tabuleiro[index]==='O'
        ){

            celula.classList.add('O');
        }
    });
}

/* VITÓRIA */

function verificarFimDeJogo(jogador){

    if(verificarVitoria(jogador)){

        jogoAtivo = false;

        tocarSom(800,300);

        destacarVitoria(jogador);

        const usuario =
            obterUsuarioSimbolo();

        if(jogador===usuario){

            pontosUsuario++;

            document
                .getElementById('pUser')
                .textContent =
                pontosUsuario;

            document
                .getElementById('textoFinal')
                .textContent =
                '🏆 Você venceu!';

        }else{

            pontosIA++;

            document
                .getElementById('pIA')
                .textContent =
                pontosIA;

            document
                .getElementById('textoFinal')
                .textContent =
                '🤖 A IA venceu!';
        }

        abrirModal();

        return true;
    }

    if(tabuleiro.every(c=>c!=='')){

        jogoAtivo = false;

        pontosEmpate++;

        document
            .getElementById('pEmpate')
            .textContent =
            pontosEmpate;

        document
            .getElementById('textoFinal')
            .textContent =
            '🤝 Empate!';

        abrirModal();

        return true;
    }

    return false;
}

function verificarVitoria(jogador){

    return COMBINACOES_VITORIA.some(comb=>

        tabuleiro[comb[0]]===jogador &&
        tabuleiro[comb[1]]===jogador &&
        tabuleiro[comb[2]]===jogador
    );
}

function destacarVitoria(jogador){

    const celulas =
        document.querySelectorAll('.celula');

    COMBINACOES_VITORIA.forEach(combinacao=>{

        if(

            tabuleiro[combinacao[0]]
            === jogador &&

            tabuleiro[combinacao[1]]
            === jogador &&

            tabuleiro[combinacao[2]]
            === jogador

        ){

            combinacao.forEach(index=>{

                celulas[index]
                .classList.add(
                    'vencedora'
                );
            });
        }
    });
}

/* MODAL */

function abrirModal(){

    document
        .getElementById('modalFinal')
        .classList.add('mostrar');
}

function fecharModalEResetar(){

    document
        .getElementById('modalFinal')
        .classList.remove('mostrar');

    setTimeout(
        reiniciarJogo,
        200
    );
}

/* RESET */

function reiniciarJogo(){

    tabuleiro = [

        '', '', '',
        '', '', '',
        '', '', ''

    ];

    jogoAtivo = true;

    turnoAtual = 'X';

    atualizarTabuleiroVisual();

    atualizarTextoStatus();
}

</script>

</body>
</html>
