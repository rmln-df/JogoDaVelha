<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TIC TAC TOE PRO</title>

<style>

:root{
--cor-x:#ff4d4d;
--cor-o:#2ecc71;
--glass:rgba(255,255,255,.06);
--bg:rgba(255,255,255,.05);
--borda:rgba(255,255,255,.1)
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

body{
font-family:'Segoe UI',Tahoma,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:100vh;
overflow:hidden;
padding:15px;
color:#fff;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#111);
background-size:400% 400%;
animation:bg 12s ease infinite
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* SPLASH */

#splash-screen{
position:fixed;
inset:0;
background:#0f172a;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999
}

.splash-titulo{
font-size:3rem;
font-weight:900;
background:linear-gradient(45deg,var(--cor-x),var(--cor-o));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.splash-subtitulo{
margin:10px 0 40px;
letter-spacing:6px;
color:#94a3b8
}

.btn-jogar-splash,.btn-reiniciar,.btn-som,.modal-content button,.menu-btn{
border:none;
cursor:pointer;
color:#fff;
font-weight:bold
}

.btn-jogar-splash{
padding:14px 40px;
border-radius:50px;
font-size:1.2rem;
background:linear-gradient(45deg,#3b82f6,#1d4ed8)
}

/* APP */

#conteudo-jogo{
display:none;
flex-direction:column;
align-items:center;
width:100%;
max-width:500px
}

h1{
font-size:2.5rem;
margin-bottom:15px
}

/* PLACAR */

.placar{
width:100%;
display:flex;
justify-content:space-around;
gap:15px;
padding:12px;
margin-bottom:15px;
border-radius:16px;
background:var(--glass);
backdrop-filter:blur(10px)
}

.placar span{
display:flex;
flex-direction:column;
align-items:center;
gap:6px
}

.placar b{
font-size:1.4rem
}

/* CONTROLES */

.controles{
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:15px
}

.coluna-seletores,.area-botoes{
display:flex;
flex-direction:column;
gap:8px
}

.menu-box{
position:relative
}

.menu-btn,.btn-som{
width:100%;
height:50px;
border-radius:8px;
background:#b3b3b3;
font-size:1rem
}

.menu-select{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer
}

.btn-reiniciar{
width:100%;
height:108px;
border-radius:10px;
background:#2563eb;
font-size:1.4rem
}

.btn-som{
background:#0f766e
}

/* STATUS */

.status{
margin-bottom:15px;
min-height:28px;
font-size:1.2rem;
font-weight:700
}

/* TABULEIRO */

.tabuleiro{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
width:100%;
max-width:320px;
aspect-ratio:1/1
}

.celula{
border:1px solid var(--borda);
border-radius:16px;
background:var(--bg);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
min-height:95px;
transition:.2s
}

.celula.X{
color:var(--cor-x);
font-size:2.6rem;
font-weight:800
}

.celula.O::after{
content:'';
width:55%;
height:55%;
border-radius:50%;
border:6px solid var(--cor-o)
}

.vencedora{
background:linear-gradient(45deg,#f59e0b,#d97706)!important
}

.esmaecer{
animation:piscar .8s infinite alternate ease-in-out
}

@keyframes piscar{
from{opacity:.7;transform:scale(.96)}
to{opacity:.2;transform:scale(.9)}
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(15,23,42,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.3s
}

.modal.mostrar{
opacity:1;
visibility:visible
}

.modal-content{
width:100%;
max-width:320px;
background:#1e293b;
padding:30px 24px;
border-radius:20px;
text-align:center
}

.modal-content h2{
margin-bottom:20px
}

.modal-content button{
width:100%;
padding:12px;
border-radius:12px;
background:linear-gradient(45deg,#10b981,#059669)
}

</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash-screen">
<div class="splash-titulo">JOGO DA VELHA</div>
<div class="splash-subtitulo">ULTIMATE PRO</div>

<button class="btn-jogar-splash" onclick="inicializarEEntrarNoJogo()">
START
</button>
</div>

<!-- APP -->

<div id="conteudo-jogo">

<h1>Jogo da Velha</h1>

<div class="placar">
<span>🏆 Você<b id="pUser">0</b></span>
<span>🤖 IA<b id="pIA">0</b></span>
<span>🤝 Empates<b id="pEmpate">0</b></span>
</div>

<div class="controles">

<div class="coluna-seletores">

<div class="menu-box">
<button class="menu-btn">Escolher o jogador</button>

<select id="simboloUsuario" class="menu-select" onchange="reiniciarJogo()">
<option value="X" selected>❌ Vermelho</option>
<option value="O">🟢 Verde</option>
</select>
</div>

<div class="menu-box">
<button class="menu-btn">Tipo de jogo</button>

<select id="modo" class="menu-select" onchange="reiniciarJogo()">
<option value="classico" selected>Clássico</option>
<option value="infinito">Infinito</option>
</select>
</div>

<div class="menu-box">
<button class="menu-btn">Nível</button>

<select id="dificuldade" class="menu-select">
<option value="facil">Fácil</option>
<option value="medio">Médio</option>
<option value="dificil" selected>Difícil</option>
</select>
</div>

</div>

<div class="area-botoes">

<button class="btn-reiniciar" onclick="reiniciarJogo()">
Reiniciar<br>partida
</button>

<button class="btn-som" id="btnSom" onclick="alternarSom()">
🔊 Som Ligado
</button>

</div>

</div>

<div class="status" id="status"></div>

<div class="tabuleiro">

<button class="celula" data-index="0" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="1" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="2" onclick="jogadaUsuario(event)"></button>

<button class="celula" data-index="3" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="4" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="5" onclick="jogadaUsuario(event)"></button>

<button class="celula" data-index="6" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="7" onclick="jogadaUsuario(event)"></button>
<button class="celula" data-index="8" onclick="jogadaUsuario(event)"></button>

</div>

</div>

<!-- MODAL -->

<div class="modal" id="modalFinal">

<div class="modal-content">

<h2 id="textoFinal"></h2>

<button onclick="fecharModalEResetar()">
Jogar Novamente
</button>

</div>

</div>

<script>

/* SOM */

let somAtivado=true;

function tocarSom(freq=440,d=120){

if(!somAtivado)return;

try{

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

const ctx=new AudioContext();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.frequency.value=freq;

osc.connect(gain);
gain.connect(ctx.destination);

gain.gain.value=.08;

osc.start();

setTimeout(()=>{
osc.stop();
ctx.close();
},d);

}catch(e){}
}

function alternarSom(){

somAtivado=!somAtivado;

document.getElementById('btnSom').innerHTML=
somAtivado
?'🔊 Som Ligado'
:'🔇 Som Desligado';
}

/* START */

function inicializarEEntrarNoJogo(){

tocarSom(500);

document.getElementById('splash-screen').style.display='none';
document.getElementById('conteudo-jogo').style.display='flex';

atualizarTextoStatus();
}

/* ESTADO */

let tabuleiro=['','','','','','','','',''];
let jogoAtivo=true;
let turnoAtual='X';

let historicoX=[];
let historicoO=[];

const VITORIAS=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

/* STATUS */

function atualizarTextoStatus(){

const status=document.getElementById('status');

const usuario=
document.getElementById('simboloUsuario').value;

status.innerHTML=
turnoAtual===usuario
?'Sua vez'
:'🤖 Máquina pensando...';
}

/* JOGADOR */

function jogadaUsuario(e){

if(!jogoAtivo)return;

const usuario=
document.getElementById('simboloUsuario').value;

if(turnoAtual!==usuario)return;

const i=parseInt(e.target.dataset.index);

if(tabuleiro[i]!=='')return;

tocarSom(500);

tabuleiro[i]=usuario;

registrarJogada(usuario,i);

atualizarTabuleiro();

if(verificarFim(usuario))return;

turnoAtual=usuario==='X'?'O':'X';

atualizarTextoStatus();

setTimeout(jogadaIA,500);
}

/* IA */

function jogadaIA(){

if(!jogoAtivo)return;

const usuario=
document.getElementById('simboloUsuario').value;

const maquina=
usuario==='X'
?'O'
:'X';

if(turnoAtual!==maquina)return;

const dificuldade=
document.getElementById('dificuldade').value;

let escolha=null;

if(dificuldade==='facil'){

escolha=aleatoria();

}else if(dificuldade==='medio'){

escolha=
Math.random()<.5
?melhorJogada(maquina,usuario)
:aleatoria();

}else{

escolha=
melhorJogada(maquina,usuario);
}

if(escolha===null)return;

tocarSom(250);

tabuleiro[escolha]=maquina;

registrarJogada(maquina,escolha);

atualizarTabuleiro();

if(verificarFim(maquina))return;

turnoAtual=usuario;

atualizarTextoStatus();
}

/* INFINITO */

function registrarJogada(jogador,i){

const modo=
document.getElementById('modo').value;

const h=
jogador==='X'
?historicoX
:historicoO;

h.push(i);

if(
modo==='infinito' &&
h.length>3
){

const r=h.shift();

tabuleiro[r]='';
}
}

/* IA AUX */

function aleatoria(){

const livres=[];

tabuleiro.forEach((c,i)=>{
if(c==='')livres.push(i);
});

if(!livres.length)return null;

return livres[
Math.floor(Math.random()*livres.length)
];
}

function melhorJogada(maquina,usuario){

for(let i=0;i<9;i++){

if(tabuleiro[i]===''){

tabuleiro[i]=maquina;

if(vitoria(maquina)){

tabuleiro[i]='';
return i;
}

tabuleiro[i]='';
}
}

for(let i=0;i<9;i++){

if(tabuleiro[i]===''){

tabuleiro[i]=usuario;

if(vitoria(usuario)){

tabuleiro[i]='';
return i;
}

tabuleiro[i]='';
}
}

if(tabuleiro[4]==='')return 4;

return aleatoria();
}

/* TABULEIRO */

function atualizarTabuleiro(){

const c=
document.querySelectorAll('.celula');

c.forEach((el,i)=>{

el.innerHTML='';
el.className='celula';

if(tabuleiro[i]==='X'){

el.innerHTML='❌';
el.classList.add('X');

}else if(tabuleiro[i]==='O'){

el.classList.add('O');
}
});

if(
document.getElementById('modo').value
==='infinito'
){

if(historicoX.length>=3)
c[historicoX[0]]
.classList.add('esmaecer');

if(historicoO.length>=3)
c[historicoO[0]]
.classList.add('esmaecer');
}
}

/* VITÓRIA */

function vitoria(j){

return VITORIAS.some(v=>

tabuleiro[v[0]]===j &&
tabuleiro[v[1]]===j &&
tabuleiro[v[2]]===j

);
}

/* FINAL */

function verificarFim(j){

if(vitoria(j)){

jogoAtivo=false;

destacar(j);

const usuario=
document.getElementById('simboloUsuario').value;

if(j===usuario){

document.getElementById('pUser').innerText++;

}else{

document.getElementById('pIA').innerText++;
}

document.getElementById('textoFinal').innerHTML=
j===usuario
?'🏆 Você venceu!'
:'🤖 A IA venceu!';

abrirModal();

return true;
}

if(
document.getElementById('modo').value==='classico'
&&
tabuleiro.every(c=>c!=='')
){

jogoAtivo=false;

document.getElementById('pEmpate').innerText++;

document.getElementById('textoFinal').innerHTML=
'🤝 Empate!';

abrirModal();

return true;
}

return false;
}

function destacar(j){

const c=
document.querySelectorAll('.celula');

VITORIAS.forEach(v=>{

if(
tabuleiro[v[0]]===j &&
tabuleiro[v[1]]===j &&
tabuleiro[v[2]]===j
){

v.forEach(i=>
c[i].classList.add('vencedora')
);
}
});
}

/* MODAL */

function abrirModal(){
document.getElementById('modalFinal')
.classList.add('mostrar');
}

function fecharModalEResetar(){

document.getElementById('modalFinal')
.classList.remove('mostrar');

setTimeout(reiniciarJogo,200);
}

/* RESET */

function reiniciarJogo(){

tabuleiro=['','','','','','','','',''];

historicoX=[];
historicoO=[];

jogoAtivo=true;
turnoAtual='X';

atualizarTabuleiro();
atualizarTextoStatus();

if(
document.getElementById('simboloUsuario').value
==='O'
){

setTimeout(jogadaIA,500);
}
}

</script>

</body>
</html>
